name: Feature idea
description: Something HaRM could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The thing you want to get done, not just the feature. "I want to know which drives are getting old" helps more than "add a drive age column", because there may be a better way to solve it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In HaRM, a spreadsheet, another app, or on paper.
  - type: textarea
    id: idea
    attributes:
      label: Your idea, if you have one
